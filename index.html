@media (prefers-color-scheme:dark){:root{--win:#202020;--fg:#ffffff;--muted:#a0a0a0;--card:#2b2b2b;--line:#3a3a3a;--accent:#60cdff;--hover:#383838;--task:rgba(32,32,32,.85)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:16px 16px 64px;color:var(--fg);font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:radial-gradient(ellipse at 20% 30%,#5fb0ff 0,transparent 55%),radial-gradient(ellipse at 80% 70%,#0a3d91 0,transparent 60%),linear-gradient(135deg,#0b5cd5,#1b2f8a 60%,#0b1d5e)}
.win{width:100%;max-width:520px;background:var(--win);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.45)}
.title{display:flex;align-items:center;height:36px;padding-left:12px;font-size:12px;background:var(--card);border-bottom:1px solid var(--line)}
.title .ico{width:14px;height:14px;margin-right:8px;background:var(--accent);border-radius:3px}
.title .name{flex:1}
.title .ctl{display:flex;height:100%}
.title .ctl span{width:46px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg)}
.title .ctl span:last-child:hover{background:#c42b1c;color:#fff}
.content{padding:24px 24px 28px}
h1{margin:0 0 4px;font-size:1.9rem;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.label{margin:18px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none}
.item:hover{background:var(--hover)}
.item .ic{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--accent);color:#fff;font-size:15px}
.item b{display:block;font-size:15px;font-weight:600}
.item small{display:block;font-size:12px;color:var(--muted)}
.task{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--task);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(128,128,128,.3)}
.start{width:36px;height:36px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:10px;border-radius:6px}
.start i{background:var(--accent);border-radius:1px}
.tb{height:36px;padding:0 12px;display:flex;align-items:center;font-size:12px;background:var(--hover);border-bottom:2px solid var(--accent);border-radius:6px}
.clock{position:absolute;right:12px;font-size:12px;line-height:1.3;text-align:right}
@media (max-width:480px){.clock{display:none}}
</style>
