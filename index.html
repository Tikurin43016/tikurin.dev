<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tikurin.dev</title>
<meta name="description" content="tikurin.dev - under construction">
<style>
:root{--bg:#f6f8fa;--fg:#1f2328;--muted:#656d76;--card:#ffffff;--line:#d0d7de;--accent:#0969da;--glow:rgba(9,105,218,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--card:#161b22;--line:#30363d;--accent:#58a6ff;--glow:rgba(88,166,255,.15)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 20%,var(--glow),transparent 60%),var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
.card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.bar span{margin-left:8px;color:var(--muted);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.body{padding:28px 24px 32px;font:15px/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.prompt{color:var(--accent)}
.muted{color:var(--muted)}
h1{margin:20px 0 4px;font:700 2.2rem/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em}
.sub{margin:0 0 20px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif}
.cursor{display:inline-block;width:.6em;height:1.1em;margin-left:2px;vertical-align:text-bottom;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<main class="card">
<div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>tikurin.dev</span></div>
<div class="body">
<div><span class="prompt">$</span> whoami</div>
<div class="muted">tikurin</div>
<h1>tikurin.dev</h1>
<p class="sub">Under construction. 準備中です。</p>
<div><span class="prompt">$</span> ls projects</div>
<div><a href="https://nitocbus.pages.dev/" rel="noopener">nitocbus</a> <span class="muted">— バス時刻表特化サイト</span></div>
<div><span class="prompt">$</span> echo $ID</div>
<div class="muted">tikurin43016</div>
<div><span class="prompt">$</span> open <a href="https://github.com/Tikurin43016" rel="noopener">github.com/Tikurin43016</a></div>
<div><span class="prompt">$</span> open <a href="https://x.com/tikurin43016" rel="noopener">x.com/tikurin43016</a></div>
<div><span class="prompt">$</span> open <a href="https://www.instagram.com/tikurin43016/" rel="noopener">instagram.com/tikurin43016</a></div>
<div><span class="prompt">$</span> <span class="cursor"></span></div>
</div>
</main>
</body>
</html>
